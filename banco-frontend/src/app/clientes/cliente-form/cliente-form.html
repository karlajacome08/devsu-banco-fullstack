<form (ngSubmit)="onSubmit()">
  <h3>{{ esEdicion ? 'Editar Cliente' : 'Nuevo Cliente' }}</h3>

  <div *ngIf="mensajeError" class="error-message">
    {{ mensajeError }}
  </div>

  <div class="form-group">
    <label>Identificación</label>
    <input type="text" [(ngModel)]="clienteLocal.identificacion" name="identificacion" />
  </div>

  <div class="form-group">
    <label>Nombre</label>
    <input type="text" [(ngModel)]="clienteLocal.nombre" name="nombre" />
  </div>

  <div class="form-group">
    <label>Género</label>
    <select [(ngModel)]="clienteLocal.genero" name="genero">
      <option value="">Seleccione...</option>
      <option value="Masculino">Masculino</option>
      <option value="Femenino">Femenino</option>
    </select>
  </div>

  <div class="form-group">
    <label>Edad</label>
    <input type="number" [(ngModel)]="clienteLocal.edad" name="edad" />
  </div>

  <div class="form-group">
    <label>Dirección</label>
    <input type="text" [(ngModel)]="clienteLocal.direccion" name="direccion" />
  </div>

  <div class="form-group">
    <label>Teléfono</label>
    <input type="text" [(ngModel)]="clienteLocal.telefono" name="telefono" />
  </div>

  <div class="form-group">
    <label>Contraseña</label>
    <input type="password" [(ngModel)]="clienteLocal.contrasena" name="contrasena" />
  </div>

  <div class="form-group checkbox-group">
    <label>
      <input type="checkbox" [(ngModel)]="clienteLocal.estado" name="estado" />
      Activo
    </label>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn-primary">Guardar</button>
    <button type="button" class="btn-secondary" (click)="onCancelar()">Cancelar</button>
  </div>
</form>
